    <path d="M60 20L110 45V145C110 220 60 255 60 255C60 255 10 220 10 145V45Z" fill="none" stroke="#E6681B" stroke-width="3" opacity="0.4"/>
    <path d="M60 10L115 37V140C115 222 60 260 60 260C60 260 5 222 5 140V37Z" fill="#E6681B" opacity="0.08"/>
  </g>
