<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#20155C"/>
      <stop offset="100%" style="stop-color:#2D1F7A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E6681B"/>
      <stop offset="100%" style="stop-color:#FF8A3C"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="0" x2="1584" y2="396" stroke="#fff" stroke-width="1"/>
    <line x1="396" y1="0" x2="1188" y2="396" stroke="#fff" stroke-width="1"/>
    <line x1="792" y1="0" x2="1584" y2="396" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="396" x2="1584" y2="0" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="198" x2="1584" y2="198" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- Accent bar -->
