  <text x="200" y="140" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="900" fill="#FFFFFF">CYBERILL</text>
  <text x="200" y="190" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#FFB347">Securing digital, transforming the future</text>
  <text x="200" y="240" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.7)">Cybersecurity · Consulting · Audit · Training</text>
  <!-- URL -->
  <text x="200" y="300" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#E6681B">cyberill.onrender.com</text>
  <!-- Profile photo placeholder circle -->
